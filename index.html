<style>

.sheetcard{background:#14130e;border:1px solid var(--gold);border-radius:24px;padding:26px 28px;text-align:center;max-width:300px;box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 50px rgba(212,175,55,.25);transform:scale(.85);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}

<body>
<div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grain"></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sheet" id="sheet" role="status" aria-live="polite"><div class="sheetcard"><svg class="tick" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="#d4af37" stroke-width="3"/><path d="M14 27l8 8 16-17" fill="none" stroke="#f6e27a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h3 id="sheetT"></h3><p id="sheetP"></p></div></div>
<main id="app"></main>
<script>
const KEY='dpp_products_luxe_v1';
const MATERIALS=['Plastic','Aluminium','Steel','Copper','Glass','Wood','Cotton','Paper','Lithium-ion battery','Circuit board'];
const EVENT_TYPES=['Purchase','Maintenance','Repair','Ownership transfer','Other'];
const RECYCLE={'Plastic':40,'Aluminium':90,'Steel':85,'Copper':90,'Glass':80,'Wood':60,'Cotton':50,'Paper':70,'Lithium-ion battery':45,'Circuit board':30};
const PALETTE=['#d4af37','#34d399','#7c5cff','#f472b6','#38bdf8','#fb923c','#a3e635','#e879f9','#22d3ee','#f87171'];
const $=s=>document.querySelector(s);
const app=$('#app');

/* ---------- storage ---------- */
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(l){try{localStorage.setItem(KEY,JSON.stringify(l))}catch(e){}}
let products=load();
if(!products){
  products=[
   {id:'demo1',name:'Rechargeable Desk Lamp',category:'Lighting',maker:'BrightHome',purchased:'2023-03-12',
    materials:['Plastic','Aluminium','Lithium-ion battery','Circuit board'],
    events:[{date:'2023-03-12',type:'Purchase',note:'Bought new'},{date:'2024-06-02',type:'Maintenance',note:'Cleaned contacts'}]},
   {id:'demo2',name:'Steel Water Bottle',category:'Drinkware',maker:'HydroCo',purchased:'2022-01-20',
    materials:['Steel','Plastic'],
    events:[{date:'2022-01-20',type:'Purchase',note:'Bought new'},{date:'2023-08-14',type:'Repair',note:'Replaced cap seal'},{date:'2025-02-01',type:'Ownership transfer',note:'Gifted to a friend'}]}
  ];
  save(products);
}

/* ---------- helpers ---------- */
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o,(k,v)=>k==='photo'?undefined:v)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const passportUrl=p=>location.href.split('#')[0]+'#/p/'+enc(p);
const ageYears=p=>Math.max(0,(Date.now()-new Date(p.purchased||Date.now()))/31557600000);
const repairCount=p=>(p.events||[]).filter(e=>e.type==='Repair').length;
const co2Saved=p=>repairCount(p)*6; // illustrative estimate
function score(p){
  const m=p.materials||[];
  const rec=m.length?m.reduce((s,x)=>s+(RECYCLE[x]||40),0)/m.length:30;
  const a=ageYears(p);
  return Math.max(0,Math.min(100,Math.round(.5*rec+Math.min(30,repairCount(p)*10)+(a<3?20:a<6?10:0))));
}
const scoreColor=s=>s>=70?'#f6e27a':s>=45?'#fbbf24':'#f87171';
function badges(p){
  const b=[],r=repairCount(p);
  if(r>=1)b.push('🔧 Repair Hero');
  if(r>=3)b.push('🏆 Master Fixer');
  if(ageYears(p)>=3)b.push('⏳ Long-Lived');
  if((p.events||[]).some(e=>e.type==='Ownership transfer'))b.push('🔁 Second Life');
  if(score(p)>=75)b.push('🌱 Circular Champion');
  if((p.events||[]).length>=5)b.push('📖 Well Documented');
  return b;
}

/* ---------- SVG graphics ---------- */
function gauge(s,cls=''){
  const r=52,C=2*Math.PI*r,id='g'+Math.random().toString(36).slice(2,7),col=scoreColor(s);
  return `<div class="gauge ${cls}"><svg viewBox="0 0 120 120" width="100%" height="100%">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a67c00"/><stop offset="1" stop-color="${col}"/></linearGradient></defs>
    <circle class="trk" cx="60" cy="60" r="${r}" fill="none" stroke-width="9"/>
    <circle class="val" cx="60" cy="60" r="${r}" fill="none" stroke="url(#${id})" stroke-width="9" stroke-linecap="round" style="color:${col}" stroke-dasharray="0 ${C}" data-len="${s/100*C}" data-c="${C}"/>
  </svg><div class="num"><div><span data-count="${s}">0</span><small>SCORE</small></div></div></div>`;
}
function donut(data){
  const tot=data.reduce((s,d)=>s+d.v,0)||1,r=56,C=2*Math.PI*r;let acc=0;
  const arcs=data.map(d=>{const len=d.v/tot*C,o=-acc;acc+=len;
    return `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${d.c}" stroke-width="18" stroke-dasharray="0 ${C}" stroke-dashoffset="${o}" data-len="${Math.max(0,len-2)}" data-c="${C}"/>`}).join('');
  return `<svg class="donut" viewBox="0 0 140 140" width="150" height="150" style="transform:rotate(-90deg)"><circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="18"/>${arcs}</svg>`;
}
function legend(data){return `<div class="legend">${data.map(d=>`<div><i style="background:${d.c}"></i>${esc(d.l)} <span style="color:var(--mute)">${d.v}</span></div>`).join('')}</div>`}
function bar(label,val,right){return `<div class="bl"><span>${esc(label)}</span><span style="color:var(--mute)">${right??val+'%'}</span></div><div class="bar"><i data-w="${val}"></i></div>`}

/* ---------- effects ---------- */
function toast(msg,type){const t=$('#toast');t.className='toast show '+(type||'');t.textContent=(type==='ok'?'✓ ':type==='err'?'✕ ':type==='star'?'★ ':'')+msg;try{navigator.vibrate&&navigator.vibrate(type==='err'?[40,40,40]:25)}catch(e){}clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)}
function success(title,text){const s=$('#sheet');$('#sheetT').textContent=title;$('#sheetP').textContent=text||'';s.classList.remove('show');void s.offsetWidth;s.classList.add('show');try{navigator.vibrate&&navigator.vibrate([30,30,60])}catch(e){}clearTimeout(success.t);success.t=setTimeout(()=>s.classList.remove('show'),2300);s.onclick=()=>s.classList.remove('show')}
function shake(sel){const e=$(sel);if(!e)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');if(e.focus)e.focus()}
function confetti(){
  const c=$('#conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const ps=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,s:Math.random()*6+3,c:PALETTE[Math.floor(Math.random()*4)],r:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<120)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
function countUp(el){
  const to=+el.dataset.count,suf=el.dataset.suf||'',t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e)+suf;if(k<1)requestAnimationFrame(f)})(t0);
}
function post(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('[data-len]').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.len+' '+c.dataset.c));
    document.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');
    document.querySelectorAll('[data-count]').forEach(countUp);
  }));
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll('.reveal,.ev').forEach((e,i)=>{e.style.transitionDelay=(i%6)*70+'ms';io.observe(e)});
  if(matchMedia('(hover:hover)').matches)document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(900px) rotateY(${px*5}deg) rotateX(${-py*5}deg)`});
    c.addEventListener('pointerleave',()=>c.style.transform='');
  });
}

/* ---------- rule engine ---------- */
function advise(p,cond){
  const m=p.materials||[],has=x=>m.includes(x),repairs=repairCount(p),years=ageYears(p);
  const out={path:'',why:[],steps:[],warn:[],missing:[]};
  if(!m.length)out.missing.push('No materials recorded, so recovery advice is generic. Add materials to the passport for accurate guidance.');
  if(!p.purchased)out.missing.push('Purchase date missing, so age was not considered.');
  if(cond==='working'){
    out.path='Reuse';out.why.push('It still works, so keeping it in use has the lowest environmental cost.');
    out.steps.push('Clean it and note any wear in the passport.','Resell, donate, or pass it to someone who needs it.','Log an "Ownership transfer" event so the next owner inherits its history.');
  }else if(cond==='minor'){
    out.path='Repair';out.why.push('A minor fault is usually cheap to fix and extends life significantly.');
    out.steps.push('Check cable, switch, charging port and connectors first.');
    if(has('Lithium-ion battery'))out.steps.push('If it holds charge poorly, replace the battery pack with a compatible one.');
    out.steps.push('Log the fix as a "Repair" event in the passport.');
  }else if(cond==='major'){
    if(repairs<2&&years<7){
      out.path='Repair';out.why.push(`Only ${repairs} repair(s) logged and about ${years.toFixed(1)} years old, so a professional repair is still worthwhile.`);
      out.steps.push('Get a quote from an authorised service centre or local repair shop.','If the quote is above about 50% of a new unit, switch to Recover.');
    }else{
      out.path='Recover';out.why.push(`Repeated repairs (${repairs}) or age (about ${years.toFixed(1)} years) make further repair unlikely to pay off.`);recoverSteps(out,m);
    }
  }else{
    out.path='Recover';out.why.push('It no longer works and is not worth repairing, so recover its materials.');recoverSteps(out,m);
  }
  return out;
}
function recoverSteps(out,m){
  const has=x=>m.includes(x);
  if(has('Lithium-ion battery')){out.steps.push('Remove the battery if possible and take it to a battery collection point.');out.warn.push('Never put lithium-ion batteries in household waste: fire risk.')}
  if(has('Circuit board'))out.steps.push('Hand the electronics to an authorised e-waste collector.');
  if(has('Aluminium')||has('Steel')||has('Copper'))out.steps.push('Metal parts (aluminium, steel, copper) can go to a scrap metal recycler.');
  if(has('Plastic'))out.steps.push('Check the plastic resin code and separate the casing for plastic recycling.');
  if(has('Glass'))out.steps.push('Separate glass and send it to glass recycling.');
  if(has('Wood')||has('Paper')||has('Cotton'))out.steps.push('Natural materials (wood, paper, cotton) can be composted or sent to fibre recycling.');
  if(!(out.steps.length))out.steps.push('Take the item to a general e-waste or recycling drop-off point.');
  out.steps.push('Log a final "Other" event: recovered / recycled.');
}

/* ---------- scanner + label ---------- */
function goRaw(raw){const i=(raw||'').indexOf('#/p/');if(i>=0){location.hash=raw.slice(i);toast('Passport found','ok');return true}return false}
function scanFile(ev){
  const f=ev.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas');const sc=Math.min(1,1000/Math.max(img.width,img.height));
    c.width=img.width*sc;c.height=img.height*sc;const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    const d=x.getImageData(0,0,c.width,c.height);const r=window.jsQR&&jsQR(d.data,d.width,d.height);
    if(r&&goRaw(r.data))return;toast(r?'That QR is not a product passport':'No QR found. Try a closer, brighter photo.','err');
  };img.src=URL.createObjectURL(f);
}
function scanFallback(msg){
  $('#scanbox').innerHTML=`<p class="warn">${msg}</p><label>Or take a photo of the QR code</label><input type="file" id="qrfile" accept="image/*" capture="environment">`;
  $('#qrfile').onchange=scanFile;
}
async function openScanner(){
  const box=$('#scanbox');
  if(!window.isSecureContext||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    scanFallback('Live camera needs a secure https link opened in Chrome or Safari (not inside WhatsApp/Instagram, and not a saved file).');return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false})}
  catch(e){scanFallback('Camera blocked. Tap the lock icon in the address bar, allow Camera, and reload.');return}
  box.innerHTML='<video id="v" playsinline muted autoplay></video><button class="ghost" id="stop">Stop</button>';
  const v=$('#v');v.srcObject=stream;
  try{await v.play()}catch(e){}
  let on=true;
  const stop=()=>{on=false;stream.getTracks().forEach(t=>t.stop());box.innerHTML=''};
  $('#stop').onclick=stop;
  const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  (async function loop(){
    while(on){
      try{
        let raw=null;
        if(det){const r=await det.detect(v);if(r.length)raw=r[0].rawValue}
        else if(window.jsQR&&v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
          const d=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(d.data,d.width,d.height);if(r)raw=r.data}
        if(raw){stop();if(!goRaw(raw))toast('That QR is not a product passport','err');return}
      }catch(e){}
      await new Promise(r=>setTimeout(r,250));
    }
  })();
}
async function openScannerOld(){
  const box=$('#scanbox');
  if(!('BarcodeDetector' in window)){box.innerHTML='<p class="warn">Live scanning is not supported in this browser. Use your phone camera app to scan the QR instead.</p>';return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    box.innerHTML='<video id="v" playsinline></video><button class="ghost" id="stop">Stop</button>';
    const v=$('#v');v.srcObject=stream;await v.play();
    const det=new BarcodeDetector({formats:['qr_code']});let on=true;
    const stop=()=>{on=false;stream.getTracks().forEach(t=>t.stop());box.innerHTML=''};
    $('#stop').onclick=stop;
    (async function loop(){while(on){
      try{const r=await det.detect(v);if(r.length){const raw=r[0].rawValue;stop();const i=raw.indexOf('#/p/');
        if(i>=0){location.hash=raw.slice(i);return}box.innerHTML='<p class="warn">That QR is not a product passport.</p>';return}}catch(e){}
      await new Promise(r=>setTimeout(r,300));}})();
  }catch(e){box.innerHTML='<p class="warn">Camera access denied or unavailable.</p>'}
}
function downloadQR(p){
  const c=document.querySelector('#qr canvas');if(!c){toast('QR not ready','err');return}
  const W=400,H=500,o=document.createElement('canvas');o.width=W;o.height=H;const x=o.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0b0d0f');g.addColorStop(1,'#1a1608');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#d4af37';x.lineWidth=3;x.strokeRect(10,10,W-20,H-20);
  x.fillStyle='#fff';x.fillRect(90,50,220,220);x.drawImage(c,100,60,200,200);
  x.textAlign='center';x.fillStyle='#f6e27a';x.font='bold 24px serif';x.fillText(p.name.slice(0,26),W/2,315);
  x.fillStyle='#d4af37';x.font='13px sans-serif';x.fillText('DIGITAL PRODUCT PASSPORT',W/2,342);
  x.fillStyle='#f3efe6';x.font='bold 40px serif';x.fillText(score(p)+' / 100',W/2,400);
  x.fillStyle='#9a9484';x.font='12px sans-serif';x.fillText('CIRCULARITY SCORE',W/2,425);x.fillText('Scan for materials, history & end-of-life options',W/2,462);
  const a=document.createElement('a');a.download=p.name.replace(/\W+/g,'_')+'_label.png';a.href=o.toDataURL('image/png');a.click();toast('Label saved to your downloads','ok');
}

  };
  $('#copy').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(passportUrl(p));toast('Passport link copied','ok')};
  $('#ae').onclick=()=>{
    const note=$('#en').value.trim();if(!note){toast('Add a short note','err');shake('#en');return}
    const type=$('#et').value;
    p.events.push({date:$('#ed').value||today(),type,note});
    const i=products.findIndex(x=>x.id===p.id);if(i>=0)products[i]=p;else products.push(p);
    save(products);syncFeedback(p);if(type==='Repair'||type==='Ownership transfer')confetti();
    location.hash='#/p/'+enc(p);route();success('Event added',type+': '+note);
  };
  $('#calc').onclick=()=>{
    const r=+$('#rq').value,n=+$('#np').value;
    if(!r||!n){$('#calcres').innerHTML='<span class="warn">Enter both amounts.</span>';return}
    const ratio=r/n,good=ratio<.5;
    $('#calcres').innerHTML=`<div class="big">${good?'Repair it':'Replace / Recover'}</div>${bar('Repair cost vs new',Math.min(100,Math.round(ratio*100)))}
      <div>${good?'Saves ₹'+(n-r)+' and avoids new manufacturing waste.':'Repair is over half the price of new. Consider the Recover route below.'}</div>`;
    post();
  };
  $('#adv').onclick=()=>{
    const r=advise(p,$('#cond').value);
    ['p1','p2','p3'].forEach(id=>$('#'+id).classList.remove('on'));
    $({Repair:'#p1',Reuse:'#p2',Recover:'#p3'}[r.path]).classList.add('on');toast('Recommendation ready: '+r.path,'ok');
    $('#res').innerHTML=`<div class="rec"><h3>Recommended: ${r.path}</h3><div>${r.why.map(esc).join(' ')}</div>
      <ul>${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      ${r.warn.map(w=>`<div class="warn">⚠ ${esc(w)}</div>`).join('')}${r.missing.map(w=>`<div class="warn">ℹ ${esc(w)}</div>`).join('')}</div>`;
  };
  post();
}

const pending=new Set();let seeded=false;let pendingPhoto=null;
function cloudPush(p){pending.add(p.id);try{return window.cloud?window.cloud.push(p):Promise.resolve(null)}catch(e){return Promise.resolve(false)}}
function syncFeedback(p){cloudPush(p).then(ok=>{if(ok===false)toast('Cloud save failed. Saved on this device only','err')})}
let onlyImp=false;
function setImportant(p,val){
  p.important=val;
  const i=products.findIndex(x=>x.id===p.id);if(i>=0)products[i]=p;else products.push(p);
  save(products);syncFeedback(p);
  toast(val?'Marked "'+p.name+'" as important':'Removed "'+p.name+'" from important',val?'star':'ok');
}
function rerenderKeep(){
  const g=s=>{const e=$(s);return e?e.value:null};
  const v={n:g('#n'),c:g('#c'),m:g('#m'),d:g('#d'),mats:[...document.querySelectorAll('#mats .on')].map(x=>x.dataset.m),imp:!!($('#imp')&&$('#imp').classList.contains('on'))};
  route(true);
  if(v.n===null)return;
  $('#n').value=v.n;$('#c').value=v.c;$('#m').value=v.m;if(v.d)$('#d').value=v.d;
  document.querySelectorAll('#mats .chip').forEach(x=>x.classList.toggle('on',v.mats.includes(x.dataset.m)));
  if($('#imp'))$('#imp').classList.toggle('on',v.imp);
}
function safeRerender(){
  const busy=['#n','#en','#rq','#np'].some(s=>{const e=$(s);return e&&e.value})||pendingPhoto;
  const typing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
  if(!busy&&!typing&&!document.querySelector('#scanbox video')&&!document.querySelector('#res .rec'))route(true);
}
window.__authChange=()=>safeRerender();
/* photo capture */
function readPhoto(f,cb){
  const im=new Image();
  im.onload=()=>{const sc=Math.min(1,380/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    cb(c.toDataURL('image/jpeg',.65))};
  im.src=URL.createObjectURL(f);
}
function bindPhoto(){
  const set=f=>{if(!f)return;readPhoto(f,d=>{pendingPhoto=d;$('#phPrev').innerHTML=`<img class="phimg" src="${d}" alt="">`;toast('Photo added','ok')})};
  $('#phCam').onclick=()=>$('#phA').click();$('#phGal').onclick=()=>$('#phB').click();
  $('#phA').onchange=e=>set(e.target.files[0]);$('#phB').onchange=e=>set(e.target.files[0]);
}
/* login + removal */
function friendlyAuthErr(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found/.test(c))return 'Wrong email or password';
  if(c.includes('email-already-in-use'))return 'Account exists. Use Log in';
  if(c.includes('weak-password'))return 'Password needs 6+ characters';
  if(c.includes('invalid-email'))return 'Enter a valid email';
  if(c.includes('operation-not-allowed'))return 'Enable Email/Password in Firebase Authentication';
  return 'Sign-in failed. Check connection and try again';
}
function accountCard(){
  if(!window.auth)return `<div class="card reveal"><h2>Account</h2><p class="desc">Sign-in (used to remove products) becomes available once cloud sync is connected.</p></div>`;
  const u=window.auth.user();
  if(u)return `<div class="card reveal"><h2>Account</h2><p class="desc">Signed in as <b>${esc(u.email)}</b>. You can remove products you registered from their passport page.</p><button class="ghost" id="logout" style="margin-top:0">Log out</button></div>`;
  return `<div class="card reveal"><h2>Account</h2><p class="desc">Sign in to remove products you registered. Browsing and registering need no account.</p>
    <label>Email</label><input id="le" type="email" autocomplete="email" placeholder="you@example.com">
    <label>Password (6+ characters)</label><input id="lp" type="password" autocomplete="current-password">
    <div class="row"><button id="login">Log in</button><button class="ghost" id="signup">Create account</button></div></div>`;
}
function bindAccount(){
  const lo=$('#logout');if(lo)lo.onclick=async()=>{await window.auth.logout();toast('Logged out','ok')};
  const go=async fn=>{
    const e=$('#le').value.trim(),p=$('#lp').value;
    if(!e||p.length<6){toast('Enter email and a 6+ character password','err');return}
    try{await fn(e,p);success('Signed in','You can now remove products you registered.')}catch(err){toast(friendlyAuthErr(err),'err')}
  };
  if($('#login'))$('#login').onclick=()=>go(window.auth.login);
  if($('#signup'))$('#signup').onclick=()=>go(window.auth.signup);
}
function manageCard(p){
  if(!window.auth)return '';
  const u=window.auth.user();
  if(!u)return `<div class="card reveal"><h2>Manage</h2><p class="desc">Sign in from the dashboard to remove products you registered.</p></div>`;
  const can=!p.ownerUid||p.ownerUid===u.uid;
  return `<div class="card reveal"><h2>Manage</h2><p class="desc">${can?'You can remove this product permanently. This cannot be undone.':'Only the account that registered this product can remove it.'}</p>${can?'<button class="danger" id="rm">🗑 Remove product</button>':''}</div>`;
}
async function removeProduct(p){
  if(!confirm('Remove "'+p.name+'" permanently?'))return;
  try{
    await window.cloud.remove(p.id);
    products=products.filter(x=>x.id!==p.id);save(products);pending.delete(p.id);
    success('Product removed','"'+p.name+'" was deleted from the registry.');location.hash='#/';
  }catch(e){toast('Not allowed: only the owner can remove this','err')}
}
window.__cloudUpdate=function(list){
  if(!list.length&&!seeded){seeded=true;products.forEach(cloudPush);return}
  seeded=true;
  const map={};list.forEach(p=>map[p.id]=p);
  products.forEach(l=>{if(pending.has(l.id)){const c=map[l.id];if(c&&(c.events||[]).length>=(l.events||[]).length)pending.delete(l.id);else map[l.id]=l}});
  products=Object.values(map);
  try{localStorage.setItem(KEY,JSON.stringify(products))}catch(e){}
  const busy=['#n','#en','#rq','#np'].some(s=>{const e=$(s);return e&&e.value});
  const typing=document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName);
  if(!busy&&!typing&&!document.querySelector('#scanbox video')&&!document.querySelector('#res .rec'))route(true);
};
function route(keep){
  const h=location.hash;if(!keep)window.scrollTo(0,0);
  if(h.startsWith('#/p/')){try{passport(dec(h.slice(4)));return}catch(e){}}
  dashboard();
}
addEventListener('hashchange',()=>route());
route();
</script>
